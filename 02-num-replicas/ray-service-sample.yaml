apiVersion: ray.io/v1
kind: RayService
metadata:
  name: rayservice-sample
spec:
  serveConfigV2: |
    applications:
      - name: llm_app
        import_path: serve_llm:app
        route_prefix: /generate
        deployments:
          - name: QwenChat
            num_replicas: 2
            ray_actor_options:
              num_cpus: 1
              memory: 2500000000   # ~2.5GB — observed actual usage was 2.2GB
  rayClusterConfig:
    rayVersion: '2.44.0'
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"   # keep the model off the head node; only the Serve proxy runs here
      template:
        spec:
          containers:
            - name: ray-head
              image: multinode-llm-serving/ray-qwen:2.44.0-aarch64
              resources:
                limits:
                  cpu: "1"
                  memory: "2Gi"
                requests:
                  cpu: "500m"
                  memory: "2Gi"
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
    workerGroupSpecs:
      - replicas: 1
        minReplicas: 1
        maxReplicas: 2
        groupName: small-group
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: multinode-llm-serving/ray-qwen:2.44.0-aarch64
                resources:
                  limits:
                    cpu: "2"
                    memory: "4Gi"
                  requests:
                    cpu: "1"
                    memory: "2Gi"